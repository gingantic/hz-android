name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# contents:read is enough. Fork-PR cache writes are denied by GitHub (expected).
permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: "2G"
  NDK_VER: "27.0.12077973"   # keep in sync with ndkVersion in app/build.gradle.kts

jobs:
  build:
    runs-on: ubuntu-24.04      # PINNED. ubuntu-latest can roll images and move NDK paths baked into CMake cache.
    environment: R2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build deps (incl. ccache + Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm meson ninja-build pkg-config \
            cmake python3-pip gperf gettext autoconf automake libtool ccache

      # --- Restore ccache BEFORE the native build (so FFmpeg/libass get hits) ---
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --set-config max_size=${{ env.CCACHE_MAXSIZE }}
          # content, not mtime: a fresh git checkout rewrites mtime and would
          # otherwise cause false cache misses.
          ccache --set-config compiler_check=content
          ccache --set-config sloppiness=time_macros,include_file_mtime,include_file_ctime
          # direct_mode (default) + depend_mode raise hit rate via -MD deps.
          ccache --set-config direct_mode=true
          ccache --set-config depend_mode=true
          ccache --zero-stats

      # Pinned, installed NDK so the shell scripts AND AGP use the SAME one.
      - name: Set up Android SDK + pinned NDK
        uses: android-actions/setup-android@v3
      - name: Install pinned NDK
        run: |
          echo "y" | sdkmanager "ndk;${{ env.NDK_VER }}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.NDK_VER }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VER }}" >> "$GITHUB_ENV"

      # --- Cache the prebuilt native artifacts -------------------------------
      # Exact-only key (no restore-keys): a script/NDK change means binaries
      # differ, so a partial restore would be wrong. If hit, we SKIP the
      # FFmpeg/libass build entirely (the biggest time saver).
      # NOTE: CMakeLists.txt is intentionally NOT in this key — editing your own
      # cpp must not force a full FFmpeg/libass rebuild; the prebuilts it produces
      # are independent of CMakeLists.txt.
      - name: Cache prebuilt native libs (jniLibs + headers)
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/cpp/include
          key: native-${{ runner.os }}-${{ env.NDK_VER }}-${{ hashFiles('ffmpeg_build_android.sh','libass_build_android.sh') }}

      # Cache the FFmpeg source tree WITH its in-tree .o files so `make` is
      # incremental across runs (the script no longer `make clean`s).
      - name: Cache FFmpeg source tree
        uses: actions/cache@v4
        with:
          path: ffmpeg-src
          key: ffmpeg-src-${{ runner.os }}-${{ env.NDK_VER }}-${{ hashFiles('ffmpeg_build_android.sh') }}
          restore-keys: |
            ffmpeg-src-${{ runner.os }}-${{ env.NDK_VER }}-

      # Only build when the prebuilt cache missed.
      - name: Clone FFmpeg source (cached)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -d ffmpeg-src ]; then
            git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          fi

      - name: Build FFmpeg
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x ffmpeg_build_android.sh
          ./ffmpeg_build_android.sh --abi arm64-v8a
        env:
          FFMPEG_SRC_DIR: ffmpeg-src

      - name: Build libass + deps
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x libass_build_android.sh
          ./libass_build_android.sh --abi arm64-v8a

      # Incremental CMake/Ninja tree for YOUR cpp (thumbnail-extractor/assrender).
      # Keyed only on OS + NDK: let Ninja decide which files to recompile. AGP
      # wipes/reconfigures .cxx itself when the native config actually changes,
      # so an unrelated build.gradle edit must not discard this tree.
      - name: Cache CMake build dir (.cxx)
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ env.NDK_VER }}
          restore-keys: |
            cxx-${{ runner.os }}-

      - name: Decode signing keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > "${{ github.workspace }}/release.keystore.jks"
          else
            echo "No release keystore secret set; skipping decode."
          fi

      # Handles Gradle wrapper + dependency downloads + build cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          R2_UPDATE_BASE_URL: ${{ secrets.R2_PUBLIC_URL }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      - name: Get Version Name
        id: version
        run: |
          VERSION_NAME=$(./gradlew -q :app:printVersionName 2>/dev/null | tail -n 1 | tr -d '[:space:]')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved version name: $VERSION_NAME"

      - name: Rename APK with version
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/HzPlayer-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HzPlayer-${{ github.sha }}-release
          path: app/build/outputs/apk/release/HzPlayer-v${{ steps.version.outputs.version_name }}.apk

      - name: Push release to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pip3 install --quiet awscli
          APK="app/build/outputs/apk/release/HzPlayer-v${{ steps.version.outputs.version_name }}.apk"
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set default.region auto
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp "$APK" "s3://${{ secrets.R2_BUCKET }}/HzPlayer-v${{ steps.version.outputs.version_name }}.apk" \
            --endpoint-url "$ENDPOINT"
          VNAME="${{ steps.version.outputs.version_name }}"
          VCODE=$(./gradlew -q :app:printVersionCode 2>/dev/null | tail -n 1 | tr -d '[:space:]')
          DL_URL="${{ secrets.R2_PUBLIC_URL }}/HzPlayer-v${VNAME}.apk"
          cat > /tmp/latest.json << EOF
          {
            "versionName": "${VNAME}",
            "versionCode": ${VCODE},
            "downloadUrl": "${DL_URL}",
            "releaseNotes": "Automated OTA build from commit ${GITHUB_SHA}"
          }
          EOF
          aws s3 cp /tmp/latest.json "s3://${{ secrets.R2_BUCKET }}/latest.json" \
            --endpoint-url "$ENDPOINT" --cache-control "no-cache"
          echo "=== Published to R2 ==="
          echo "APK: HzPlayer-v${VNAME}.apk"
          echo "Manifest: latest.json"

      - name: ccache stats
        run: |
          echo "Native prebuilt cache hit: ${{ steps.native-cache.outputs.cache-hit }}"
          ccache --show-stats
