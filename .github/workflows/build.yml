name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm meson ninja-build pkg-config \
            cmake python3-pip gperf gettext autoconf automake libtool

      - name: Clone FFmpeg Source
        run: git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build FFmpeg Shared Libraries
        run: |
          chmod +x ffmpeg_build_android.sh
          ./ffmpeg_build_android.sh --abi arm64-v8a --ndk-path "$ANDROID_NDK_ROOT"
        env:
          FFMPEG_SRC_DIR: ffmpeg-src

      - name: Build libass and Dependencies
        run: |
          chmod +x libass_build_android.sh
          ./libass_build_android.sh --abi arm64-v8a --ndk-path "$ANDROID_NDK_ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          GITHUB_UPDATE_TOKEN: ${{ secrets.GITHUB_UPDATE_TOKEN }}

      - name: Get Version Name
        id: version
        run: |
          # Use --quiet and tail to strip any stray Gradle log lines, keeping only the last line (the version)
          VERSION_NAME=$(./gradlew -q :app:printVersionName 2>/dev/null | tail -n 1 | tr -d '[:space:]')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Resolved version name: $VERSION_NAME"

      - name: Rename APK with version
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/HzPlayer-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HzPlayer-${{ github.sha }}-release
          path: app/build/outputs/apk/release/HzPlayer-v${{ steps.version.outputs.version_name }}.apk

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HzPlayer v${{ steps.version.outputs.version_name }}
          body: |
            ## Automated OTA Pre-release Build
            This release contains the latest automated build of Hz Player.

            **Version**: `v${{ steps.version.outputs.version_name }}`
            **Commit**: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/release/HzPlayer-v${{ steps.version.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
