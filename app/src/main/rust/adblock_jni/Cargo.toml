[package]
name = "adblock_jni"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `single-thread` must stay OFF: it swaps the engine's internals to Rc/RefCell,
# which is undefined behaviour once WebView worker threads share the engine.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = { version = "0.21", default-features = false }
